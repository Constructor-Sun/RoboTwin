# if you want to modify the config, please check the following tutorial first:
# https://robotwin-platform.github.io/doc/usage/configurations.html
render_freq: 0
episode_num: 5
use_seed: false
save_freq: 15
embodiment: [aloha-agilex]
language_num: 100
domain_randomization:
  random_background: false
  cluttered_table: false
  clean_background_rate: 1
  random_head_camera_dis: 0
  random_table_height: 0
  random_light: false
  crazy_random_light_rate: 0
camera_perturbation:
  enabled: false
  c1_distance: false
  c1_distance_scale_range: [0.85, 1.0]
  c2_spherical: false
  c2_azimuth_deg: 10
  c2_elevation_deg: 10
  c2_distance_ratio: 0.10
  c3_orientation: false
  c3_yaw_deg: 5
  c3_pitch_deg: 5
  c3_roll_deg: 5
  anchor_mode: table_center
sensor_noise:
  enabled: true
  cycle_by_episode: true
  severity_range: [2, 3]
  types: [motion_blur, gaussian_blur, zoom_blur, fog, glass_blur]
  cameras: [head_camera, left_camera, right_camera]
camera:
  head_camera_type: D435
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: true
data_type:
  rgb: true
  third_view: false
  depth: false
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data
clear_cache_freq: 5
collect_data: true
eval_video_log: true
